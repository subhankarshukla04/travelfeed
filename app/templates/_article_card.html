<li data-card class="article-card group -mx-3" data-published="{{ a.published_at.isoformat() if a.published_at else '' }}">
  <a href="{{ a.url }}" target="_blank" rel="noopener noreferrer"
     title="Read on {{ a.source.name }}"
     class="block px-3 py-4 rounded-md transition-colors hover:bg-[var(--line-soft)] focus:bg-[var(--line-soft)]">
    <h3 class="text-[15.5px] sm:text-[16px] leading-snug font-medium tracking-tight" style="color: var(--ink)">
      {{ a.title }}
      <svg class="ext-arrow" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7M21 3l-9 9M5 5h6M5 12v7h7"/></svg>
    </h3>
    <div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11.5px]">
      <span class="mono uppercase tracking-wide" style="color: var(--ink-soft)">{{ a.source.name }}</span>
      <span style="color: var(--line)">·</span>
      <time class="mono" style="color: var(--ink-mute)">{{ a.published_at | humanize_date }}</time>
      {% if a.capital_signal %}
        <span class="mono text-[9.5px] uppercase tracking-wider px-1.5 py-0.5 rounded-sm" style="background: var(--accent); color: #022c22">capital</span>
      {% endif %}
      {% if a.confidence == 'low' %}
        <span class="mono text-[9.5px] uppercase tracking-wider px-1.5 py-0.5 rounded-sm" style="border: 1px solid var(--line); color: var(--ink-mute)" title="Pattern match: {{ (a.confidence_flags or [])|join(', ') }}">unverified</span>
      {% endif %}
      {% if a.companies %}
        {% for c in a.companies[:2] %}
          <span class="mono text-[10px] px-1.5 py-0.5 rounded-sm" style="background: var(--line-soft); color: var(--ink-soft)">{{ c }}</span>
        {% endfor %}
      {% endif %}
    </div>
  </a>
</li>
